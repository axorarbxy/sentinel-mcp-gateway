<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sentinel-MCP Guard</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 340px;
      background: #0a1929;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      padding: 16px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 10px;
      padding-bottom: 14px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      margin-bottom: 16px;
    }

    .shield {
      font-size: 1.6rem;
    }

    .header h2 {
      margin: 0;
      font-size: 1.05rem;
      font-weight: 700;
      color: #90caf9;
    }

    .header small {
      display: block;
      font-size: 0.7rem;
      color: #607d8b;
      margin-top: 2px;
      font-weight: 400;
    }

    .status {
      text-align: center;
      padding: 10px;
      border-radius: 8px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .status.active {
      background: rgba(76, 175, 80, 0.1);
      color: #4caf50;
      border: 1px solid rgba(76, 175, 80, 0.2);
    }

    .status.off {
      background: rgba(158, 158, 158, 0.1);
      color: #9e9e9e;
      border: 1px solid rgba(158, 158, 158, 0.2);
    }

    .stats {
      margin-bottom: 16px;
    }

    .stat {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 12px;
      background: rgba(26, 35, 50, 0.6);
      border-radius: 8px;
      margin-bottom: 8px;
      border: 1px solid rgba(255, 255, 255, 0.04);
    }

    .stat-label {
      color: #90caf9;
      font-size: 0.85rem;
    }

    .stat-value {
      font-weight: 700;
      font-size: 1.1rem;
      color: #fff;
    }

    .stat-value.blocked {
      color: #f44336;
    }

    .toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 12px;
      background: rgba(26, 35, 50, 0.6);
      border-radius: 8px;
      margin-bottom: 12px;
      border: 1px solid rgba(255, 255, 255, 0.04);
      font-size: 0.85rem;
    }

    .switch {
      position: relative;
      width: 44px;
      height: 24px;
      background: #333;
      border-radius: 12px;
      cursor: pointer;
      transition: background 0.2s;
      flex-shrink: 0;
    }

    .switch.on {
      background: #4caf50;
    }

    .switch::after {
      content: '';
      position: absolute;
      top: 2px;
      left: 2px;
      width: 20px;
      height: 20px;
      background: white;
      border-radius: 50%;
      transition: transform 0.2s;
    }

    .switch.on::after {
      transform: translateX(20px);
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 6px;
      background: transparent;
      color: #90caf9;
      border: 1px solid rgba(144, 202, 249, 0.4);
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.85rem;
      font-weight: 600;
      transition: all 0.2s;
      font-family: inherit;
    }

    button:hover {
      background: rgba(144, 202, 249, 0.1);
      border-color: #90caf9;
    }

    .footer {
      margin-top: 14px;
      padding-top: 12px;
      border-top: 1px solid rgba(255, 255, 255, 0.05);
      text-align: center;
      font-size: 0.7rem;
      color: #607d8b;
    }

    .footer a {
      color: #90caf9;
      text-decoration: none;
    }

    .footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="header">
    <span class="shield">🛡️</span>
    <div>
      <h2>Sentinel-MCP Guard</h2>
      <small>AI-powered phishing protection</small>
    </div>
  </div>

  <div class="status active" id="status">
    <span>●</span>
    <span id="statusText">Protection Active</span>
  </div>

  <div class="stats">
    <div class="stat">
      <span class="stat-label">URLs Scanned</span>
      <span class="stat-value" id="total">0</span>
    </div>
    <div class="stat">
      <span class="stat-label">Threats Blocked</span>
      <span class="stat-value blocked" id="blocked">0</span>
    </div>
  </div>

  <div class="toggle">
    <span>Protection Enabled</span>
    <div class="switch on" id="toggle"></div>
  </div>

  <button id="clearCache">Clear Cache</button>

  <div class="footer">
    Powered by <a href="http://localhost:3000" target="_blank">Sentinel-MCP</a> v2.0
  </div>

  <script src="popup.js"></script>
</body>
</html>
